name: Fetch Gaming Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:    # Allows manual run button

permissions:
  contents: write # Allows saving the file
  actions: write  # Allows triggering deploy workflow

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Fetch Script
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          XBOX_API_KEY: ${{ secrets.XBOX_API_KEY }}
          RETRO_API_KEY: ${{ secrets.RETRO_API_KEY }}
          RETRO_USER: ${{ secrets.RETRO_USER }}
        run: node scripts/fetch-stats.js

      - name: Commit, Push, and Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'kylehonke'
          git config --global user.email '135394003+kylehonke@users.noreply.github.com'
          
          # Stage the stats file
          git add public/stats.json
          
          # Check if stats file has any staged changes
          if ! git diff --staged --quiet; then
            git commit -m "[Auto] Refresh stats"
            git push
            
            # Trigger the deploy workflow explicitly
            echo "Stats updated, triggering deployment..."
            gh workflow run deploy.yml --ref main
          else
            echo "No changes to stats.json, skipping deployment."
          fi